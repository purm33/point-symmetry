<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대칭 지오보드 대결</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#16212c;--mut:#566574;--line:#d3dce5;--board:#d7e2ec;--peg:#7f92a5;--acc:#d6336c;--me:#1971c2;--ok:#2b8a3e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--card:#16212d;--ink:#e9eff5;--mut:#9aabbb;--line:#2b3a49;--board:#1d2b3a;--peg:#6f8499;--acc:#f06595;--me:#4dabf7;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1620;--card:#16212d;--ink:#e9eff5;--mut:#9aabbb;--line:#2b3a49;--board:#1d2b3a;--peg:#6f8499;--acc:#f06595;--me:#4dabf7;--ok:#69db7c;color-scheme:dark}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:18px max(14px,env(safe-area-inset-left,0px)) 28px max(14px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.app.wide{max-width:900px}
h1{margin:0;font:700 25px/1.2 "Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.sub{margin:3px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lab{font-size:13px;color:var(--mut)}
.btn{font:500 14px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:18px;min-width:110px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px}
.seg label{position:relative}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg span{display:block;padding:6px 13px;border-radius:999px;font-size:14px;color:var(--mut);white-space:nowrap}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.nums .btn{font-size:18px;padding:6px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.who{font-weight:700}
.clock{font:700 28px/1 "Jua","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
.msg{margin:6px 0 0;min-height:2.9em;font-size:14.5px}
.board{position:relative;padding:10px}
.board svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.veil{position:absolute;inset:10px;display:grid;place-items:center;border-radius:12px;background:var(--board);font:700 110px/1 "Jua","Malgun Gothic",sans-serif;text-align:center;pointer-events:none;padding:16px}
.veil.s{font-size:22px;line-height:1.5}
.bg{fill:var(--board)}.peg{fill:var(--peg)}.ctr{fill:var(--acc)}
.ctr-ring{fill:none;stroke:var(--acc);stroke-width:2.5}
.ctr-t{font:700 12px sans-serif;fill:var(--acc)}
.axis{stroke:var(--acc);stroke-width:2.5;stroke-dasharray:7 6}
.given{fill:var(--ink);fill-opacity:.14;stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.given.open{fill:none}
.gdot{fill:var(--ink)}
.letter{font:700 14px sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-width:3px}
.letter.t{fill:var(--acc)}
.link{stroke:var(--acc);stroke-width:1.8;stroke-dasharray:5 5;opacity:.85}
.band{stroke:var(--me);stroke-width:6;stroke-linecap:round}
.joint{fill:var(--me)}
.band.ok{stroke:var(--ok)}
.joint.ok{fill:var(--ok)}
.okfill{fill:var(--ok);fill-opacity:.28;stroke:none}
@media (prefers-reduced-motion:no-preference){
  .okfill{animation:okfill 1.1s ease-out}
  .band.ok{animation:okglow .55s ease-in-out 3}
}
@keyframes okfill{0%{fill-opacity:0}35%{fill-opacity:.55}100%{fill-opacity:.28}}
@keyframes okglow{0%,100%{stroke-width:6}50%{stroke-width:12}}
.sel{fill:none;stroke:var(--me);stroke-width:3.5}
.answer{stroke:var(--ok);stroke-width:5;stroke-dasharray:1 10;stroke-linecap:round}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--acc)}
.stat{margin-left:auto;color:var(--mut);font-size:14px}
ol.rk{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
ol.rk li,.chip{padding:4px 12px;border-radius:999px;background:var(--board);font-size:14px;font-variant-numeric:tabular-nums}
ol.rk li b,.chip b{margin-right:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
h2{margin:0 0 4px;font-size:15px}
input.pin{font:700 20px sans-serif;width:6ch;text-align:center;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:.3em}
</style></head>
<body>
<main class="app" id="app">
  <header><h1>대칭 지오보드 대결</h1><p class="sub" id="sub"></p></header>

  <!-- 학생: 번호 고르기 -->
  <section class="card" id="join" hidden>
    <b>내 번호를 눌러 주세요</b>
    <div class="nums" id="nums"></div>
  </section>

  <!-- 학생: 진행 상황과 보드 -->
  <section class="card" id="stage" hidden>
    <div class="top"><span class="who" id="who"></span><span class="clock" id="clock"></span></div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>
  <div class="card board" id="boardCard" hidden>
    <svg id="svg" role="img" aria-label="점대칭 지오보드"></svg>
    <div class="veil" id="veil" hidden></div>
  </div>
  <div class="tools" id="tools" hidden>
    <button class="btn" id="undo" type="button">되돌리기</button>
    <button class="btn" id="clear" type="button">모두 지우기</button>
    <label class="check" id="linkWrap"><input type="checkbox" id="links"><span>대응점 연결선</span></label>
    <button class="btn" id="newp" type="button">새 연습 문제</button>
  </div>

  <!-- 교사: 비밀번호 -->
  <form class="card row" id="pinForm" hidden>
    <label for="pin">교사 비밀번호</label>
    <input class="pin" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button class="btn main" type="submit" style="font-size:15px;min-width:0">확인</button>
    <span class="lab" id="pinMsg"></span>
  </form>

  <!-- 교사: 진행 화면 -->
  <section id="teacher" hidden>
    <div class="card row">
      <span class="lab">난이도</span>
      <div class="seg" role="radiogroup" aria-label="난이도">
        <label><input type="radio" name="lv" value="easy" checked><span>쉬움</span></label>
        <label><input type="radio" name="lv" value="mid"><span>보통</span></label>
        <label><input type="radio" name="lv" value="hard"><span>어려움</span></label>
        <label><input type="radio" name="lv" value="all"><span>섞어서</span></label>
      </div>
      <span class="lab">유형</span>
      <div class="seg" role="radiogroup" aria-label="유형">
        <label><input type="radio" name="ty" value="all" checked><span>섞어서</span></label>
        <label><input type="radio" name="ty" value="p"><span>점대칭</span></label>
        <label><input type="radio" name="ty" value="l"><span>선대칭</span></label>
      </div>
      <button class="btn main" id="tgo" type="button">시작</button>
      <button class="btn" id="treset" type="button">전체 초기화</button>
      <span class="stat" id="tstat"></span>
    </div>
    <p class="msg" id="tmsg" style="padding:0 4px"></p>
    <div class="cols">
      <div class="card"><h2>이번 라운드 기록</h2><ol class="rk" id="trank"></ol></div>
      <div class="card"><h2>누적 점수</h2><div class="row" id="tscore"></div></div>
    </div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,update,onValue,get,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== 설정: 교사 화면 비밀번호는 여기서 바꾸세요 ===== */
const TEACHER_PIN='1234';
/* 번호: 여학생 1~12번, 남학생 51~63번 */
const GIRLS=Array.from({length:12},(_,i)=>i+1),BOYS=Array.from({length:13},(_,i)=>i+51),NUMS=GIRLS.concat(BOYS);
const db=getDatabase(initializeApp({
  apiKey:"AIzaSyAzd6e5ZMFHuXBT6UdVmoUPy7eJNNChS1M",
  authDomain:"point-symmetry.firebaseapp.com",
  databaseURL:"https://point-symmetry-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"point-symmetry",
  storageBucket:"point-symmetry.firebasestorage.app",
  messagingSenderId:"604772884112",
  appId:"1:604772884112:web:1bda032bff4c914df1c215"
}));

const $=i=>document.getElementById(i);
const isT=new URLSearchParams(location.search).has('teacher');
let off=0;onValue(ref(db,'.info/serverTimeOffset'),s=>{off=s.val()||0});
const now=()=>Date.now()+off;
const fmt=ms=>(ms/1000).toFixed(1)+'초';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
/* 학생 번호는 이 탭에만 임시로 저장한다. 창을 닫거나 날짜가 바뀌면 사라져서, 다음에 열면 번호 선택 화면이 나온다 */
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){return null}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function loadNo(){ls('pg.no',null);if(ss('pg.day')!==today()){ss('pg.no',null);return null}return ss('pg.no')}
function saveNo(n){ss('pg.no',n);ss('pg.day',today())}
function clearNo(){ss('pg.no',null);ss('pg.day',null)}

/* ===== 문제 ===== */
const PP=[
 ['easy','직각삼각형',[[1,1],[4,1],[1,4]]],['easy','정사각형',[[1,1],[4,1],[4,4],[1,4]]],
 ['easy','평행사변형',[[1,3],[3,1],[5,1],[3,3]]],['easy','사다리꼴',[[1,4],[2,1],[4,1],[5,4]]],['easy','큰 삼각형',[[0,1],[4,1],[0,5]]],
 ['mid','ㄱ자',[[1,1],[5,1],[5,3],[3,3],[3,5],[1,5]]],['mid','계단',[[0,1],[2,1],[2,3],[4,3],[4,5],[0,5]]],
 ['mid','집',[[1,4],[1,2],[3,0],[5,2],[5,4]]],['mid','화살표',[[0,2],[3,2],[3,0],[5,3],[3,5],[3,4],[0,4]]],
 ['mid','플러스',[[1,0],[2,0],[2,1],[3,1],[3,2],[2,2],[2,3],[1,3],[1,2],[0,2],[0,1],[1,1]]],
 ['hard','깃발',[[1,0],[1,5],[2,5],[2,3],[5,2],[2,1],[2,0]]],['hard','번개',[[2,0],[5,0],[3,2],[5,2],[1,5],[2,3],[0,3]]],
 ['hard','넓은 화살',[[0,1],[3,1],[3,0],[5,2],[3,4],[3,3],[0,3]]],['hard','비스듬한 도형',[[0,4],[2,0],[5,1],[4,3],[3,4]]]
];
/* 선대칭 문제: 대칭축(x=5)에서 시작해 축에서 끝나는 한쪽 절반의 꺾은선 */
const PL=[
 ['easy','집',[[5,1],[2,4],[2,9],[5,9]]],['easy','마름모',[[5,1],[1,5],[5,9]]],['easy','연',[[5,0],[2,4],[5,10]]],['easy','화살표',[[5,1],[1,5],[3,5],[3,9],[5,9]]],
 ['mid','보석',[[5,1],[3,1],[0,4],[5,10]]],['mid','전나무',[[5,1],[3,4],[4,4],[2,7],[4,7],[4,9],[5,9]]],
 ['mid','하트',[[5,3],[4,1],[2,1],[0,3],[0,5],[5,10]]],['mid','산',[[5,1],[3,5],[2,4],[0,9],[5,9]]],
 ['hard','별',[[5,0],[4,3],[0,3],[3,5],[1,9],[5,7]]],['hard','나비',[[5,3],[3,1],[0,1],[1,5],[0,9],[3,9],[5,7]]],
 ['hard','성',[[5,2],[4,2],[4,0],[2,0],[2,2],[0,2],[0,10],[5,10]]]
];
const PZ=PP.map(e=>[e[0],e[1],e[2],'p']).concat(PL.map(e=>[e[0],e[1],e[2],'l']));
const LET='ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌ';
function inst(i,f){
  const kind=PZ[i][3];
  let p=PZ[i][2].map(a=>[a[0],a[1]]);
  if(f.t)p=p.map(a=>[a[1],a[0]]);
  if(f.x)p=p.map(a=>[10-a[0],a[1]]);
  if(f.y)p=p.map(a=>[a[0],10-a[1]]);
  const ax=f.t?'h':'v';
  const r=kind==='p'?p.map(a=>[10-a[0],10-a[1]]):p.map(a=>ax==='v'?[10-a[0],a[1]]:[a[0],10-a[1]]);
  const z={n:PZ[i][1],kind,ax,closed:kind==='p',pts:p,rpts:r};
  z.target=prim(segsOf(z));
  return z;
}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const ek=(x1,y1,x2,y2)=>(x1>x2||(x1===x2&&y1>y2))?x2+','+y2+'-'+x1+','+y1:x1+','+y1+'-'+x2+','+y2;
function prim(ss){const s=new Set();ss.forEach(g=>{const dx=g[1][0]-g[0][0],dy=g[1][1]-g[0][1],n=gcd(dx,dy);if(!n)return;const sx=dx/n,sy=dy/n;for(let i=0;i<n;i++){const x=g[0][0]+sx*i,y=g[0][1]+sy*i;s.add(ek(x,y,x+sx,y+sy))}});return s}
const poly=p=>p.map((a,i)=>[a,p[(i+1)%p.length]]);
const chain=p=>p.slice(1).map((a,i)=>[p[i],a]);
const segsOf=z=>z.closed?poly(z.rpts):chain(z.rpts);
function isDone(){const m=prim(segs);if(m.size!==pz.target.size)return false;for(const k of m)if(!pz.target.has(k))return false;return true}

/* ===== 보드 ===== */
const CELL=40,PAD=34,VB=PAD*2+CELL*10,MID=PAD+CELL*5,NS='http://www.w3.org/2000/svg';
const px=v=>PAD+v*CELL;
const el=(t,a,par)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(par)par.appendChild(e);return e};
let mode='wait',pz=null,segs=[],cur=null,hist=[],finished=false,live=false,showAns=false,g={state:'idle'},results={},no=null,curRound=0,unsubR=null,finMs=0;
const svg=$('svg'),G={};

function buildBoard(){
  svg.setAttribute('viewBox','0 0 '+VB+' '+VB);
  el('rect',{x:0,y:0,width:VB,height:VB,rx:16,'class':'bg'},svg);
  ['link','pegs','ctr','given','answer','player','sel','lab'].forEach(n=>G[n]=el('g',{},svg));
  for(let y=0;y<=10;y++)for(let x=0;x<=10;x++)if(!(x===5&&y===5))el('circle',{cx:px(x),cy:px(y),r:4,'class':'peg'},G.pegs);
  svg.addEventListener('pointerdown',e=>{e.preventDefault();onTap(e)});
}
const pts2s=p=>p.map(a=>px(a[0])+','+px(a[1])).join(' ');
function lab(p,t,c){el('text',{x:px(p[0])+8,y:px(p[1])-8,'class':'letter'+(c?' '+c:'')},G.lab).textContent=t}
function render(){
  Object.keys(G).forEach(n=>{if(n!=='pegs')G[n].replaceChildren()});
  if(!pz)return;
  if(pz.kind==='p'){
    el('circle',{cx:MID,cy:MID,r:6.5,'class':'ctr'},G.ctr);
    el('circle',{cx:MID,cy:MID,r:12,'class':'ctr-ring'},G.ctr);
    el('text',{x:MID+15,y:MID+22,'class':'ctr-t'},G.ctr).textContent='대칭의 중심';
  }else{
    const e=PAD+CELL*10+12;
    if(pz.ax==='v'){el('line',{x1:MID,y1:PAD-12,x2:MID,y2:e,'class':'axis'},G.ctr);el('text',{x:MID+6,y:14,'class':'ctr-t'},G.ctr).textContent='대칭축'}
    else{el('line',{x1:PAD-12,y1:MID,x2:e,y2:MID,'class':'axis'},G.ctr);el('text',{x:VB-62,y:MID-8,'class':'ctr-t'},G.ctr).textContent='대칭축'}
  }
  const showG=mode==='practice'||live||finished||g.state==='done';
  if(showG){
    if(mode==='practice'&&$('links').checked)pz.pts.forEach((p,i)=>{const q=pz.rpts[i];el('line',{x1:px(p[0]),y1:px(p[1]),x2:px(q[0]),y2:px(q[1]),'class':'link'},G.link)});
    el(pz.closed?'polygon':'polyline',{points:pts2s(pz.pts),'class':'given'+(pz.closed?'':' open')},G.given);
    pz.pts.forEach((p,i)=>{el('circle',{cx:px(p[0]),cy:px(p[1]),r:4.5,'class':'gdot'},G.given);lab(p,LET[i]||'')});
    if(mode==='practice'&&$('links').checked)pz.rpts.forEach((p,i)=>lab(p,(LET[i]||'')+'\u2032','t'));
  }
  if(showAns)segsOf(pz).forEach(s=>el('line',{x1:px(s[0][0]),y1:px(s[0][1]),x2:px(s[1][0]),y2:px(s[1][1]),'class':'answer'},G.answer));
  if(finished)el('polygon',{points:pts2s(pz.closed?pz.rpts:pz.pts.concat(pz.rpts.slice().reverse())),'class':'okfill'},G.player);
  segs.forEach(s=>el('line',{x1:px(s[0][0]),y1:px(s[0][1]),x2:px(s[1][0]),y2:px(s[1][1]),'class':'band'+(finished?' ok':'')},G.player));
  segs.forEach(s=>el('circle',{cx:px(s[1][0]),cy:px(s[1][1]),r:3.5,'class':'joint'+(finished?' ok':'')},G.player));
  if(cur)el('circle',{cx:px(cur[0]),cy:px(cur[1]),r:11,'class':'sel'},G.sel);
}
const canPlay=()=>!finished&&(mode==='practice'||(mode==='race'&&live&&g.state==='play'));
function onTap(e){
  if(!canPlay())return;
  const r=svg.getBoundingClientRect();if(!r.width)return;
  const sx=(e.clientX-r.left)*VB/r.width,sy=(e.clientY-r.top)*VB/r.height;
  const gx=Math.round((sx-PAD)/CELL),gy=Math.round((sy-PAD)/CELL);
  if(gx<0||gx>10||gy<0||gy>10||Math.hypot(sx-px(gx),sy-px(gy))>CELL*.75)return;
  hist.push({s:segs.slice(),c:cur});
  if(!cur)cur=[gx,gy];else if(cur[0]===gx&&cur[1]===gy)cur=null;else{segs.push([cur,[gx,gy]]);cur=[gx,gy]}
  render();
  if(isDone())solved();
}
/* 완성했을 때 보드 가운데에서 색종이가 터진다. 약 1.8초 뒤 사라진다. 학교 기기에서 애니메이션 효과가 꺼져 있는 경우가 많아 동작 줄이기 설정과 상관없이 나오게 했다 */
function confetti(){
  const c=document.createElement('canvas'),dpr=window.devicePixelRatio||1;
  c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const r=svg.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
  const cols=['#f06595','#ffd43b','#4dabf7','#69db7c','#ff922b','#9775fa'];
  const ps=Array.from({length:80},()=>{const a=Math.random()*Math.PI*2,v=4+Math.random()*8;
    return {x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,w:6+Math.random()*6,h:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[Math.floor(Math.random()*cols.length)]}});
  let t0=0;
  requestAnimationFrame(function f(t){
    if(!t0)t0=t;const dt=t-t0;
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      x.save();x.globalAlpha=Math.max(0,1-dt/1800);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(dt<1800)requestAnimationFrame(f);else c.remove();
  });
}
function solved(){
  cur=null;finished=true;confetti();
  if(mode==='practice'){say('정답이에요! 「새 연습 문제」를 눌러 계속 연습해요.');render();return}
  finMs=Math.round(now()-g.startAt);
  set(ref(db,'results/'+curRound+'/'+no),finMs);
  say('완성! 기록 '+fmt(finMs)+'. 선생님이 끝낼 때까지 기다려요.');render();
}
const say=t=>{$('msg').textContent=t};
function setClock(t){$('clock').textContent=t}

/* ===== 학생 흐름 ===== */
function newPractice(){
  const i=Math.floor(Math.random()*PZ.length);
  pz=inst(i,{t:Math.random()<.5,x:Math.random()<.5,y:Math.random()<.5});
  mode='practice';segs=[];cur=null;hist=[];finished=false;showAns=false;live=true;
  $('veil').hidden=true;$('newp').hidden=false;$('linkWrap').hidden=false;
  setClock('');say('연습 시간이에요. '+(pz.kind==='p'?'빨간 점을 중심으로 180° 돌린 모양을 만들어 보세요.':'대칭축을 거울처럼 접었을 때 겹치는 모양을 건너편에 만들어 보세요.')+' 선생님이 시작하면 대결이 열려요.');
  render();
}
function startRace(){
  const p=g.puzzle;pz=inst(p.i,p);
  mode='race';curRound=g.round;segs=[];cur=null;hist=[];finished=false;showAns=false;live=false;results={};
  if(unsubR)unsubR();
  unsubR=onValue(ref(db,'results/'+curRound),s=>{results=s.val()||{};showRank()});
  $('newp').hidden=true;$('linkWrap').hidden=true;
  say('준비하세요! 곧 그림이 나타나요.');render();
}
function showRank(){
  if(mode!=='race'||g.state!=='done')return;
  const ord=Object.entries(results).sort((a,b)=>a[1]-b[1]);
  const idx=ord.findIndex(a=>a[0]===String(no));
  say(idx>=0?'끝! 나는 '+(idx+1)+'등 ('+fmt(ord[idx][1])+'), 전체 '+ord.length+'명이 완성했어요.':'시간이 끝났어요. 정답은 초록 점선이에요.');
}
setInterval(()=>{
  if(isT||mode!=='race')return;
  if(g.state==='play'&&!finished){
    const t=now()-g.startAt;
    if(t<0){const v=$('veil');v.className='veil';v.textContent=Math.ceil(-t/1000);v.hidden=false;setClock('');return}
    $('veil').hidden=true;
    if(!live){live=true;say(pz.kind==='p'?'빨간 점을 중심으로 180° 돌린 모양을 먼저 완성하세요!':'대칭축 건너편에 거울처럼 같은 모양을 먼저 완성하세요!');render()}
    setClock(fmt(t));
  }else if(finished)setClock(fmt(finMs));
},100);

let chBtn=null;
function lockChange(){if(chBtn){chBtn.disabled=g.state==='play';chBtn.title=g.state==='play'?'대결 중에는 번호를 바꿀 수 없어요.':''}}
function onGame(v){
  g=v||{state:'idle'};lockChange();
  if(isT){teacherView();return}
  if(!no)return;
  if(g.state==='play'&&g.round!==curRound){startRace()}
  else if(g.state==='done'&&mode==='race'){
    $('veil').hidden=true;live=true;if(!finished)showAns=true;render();showRank();
  }else if(g.state==='idle'&&mode!=='practice')newPractice();
  else if(mode==='wait')newPractice();
}

function register(){
  const pr=ref(db,'players/'+no);
  onValue(ref(db,'.info/connected'),s=>{if(s.val()){set(pr,true);onDisconnect(pr).remove()}});
}
function studentInit(){
  $('sub').textContent='점대칭과 선대칭 문제를 풀어요. 선생님이 시작하면 모두 같은 문제를 동시에 풀고, 빨리 완성한 순서대로 순위가 정해져요.';
  buildBoard();
  const n0=$('nums');
  [['여학생',GIRLS],['남학생',BOYS]].forEach(([t,list])=>{
    const h=document.createElement('div');h.className='lab';h.style.gridColumn='1/-1';h.textContent=t;n0.appendChild(h);
    list.forEach(i=>{const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=i;b.id='n'+i;b.onclick=()=>pick(i);n0.appendChild(b)});
  });
  onValue(ref(db,'players'),s=>{const p=s.val()||{};NUMS.forEach(i=>{const b=$('n'+i);if(b)b.disabled=!!p[i]&&String(i)!==String(no)})});
  $('undo').onclick=()=>{if(!canPlay())return;const h=hist.pop();if(!h)return;segs=h.s;cur=h.c;render()};
  $('clear').onclick=()=>{if(!canPlay()||(!segs.length&&!cur))return;hist.push({s:segs.slice(),c:cur});segs=[];cur=null;render()};
  $('newp').onclick=newPractice;$('links').onchange=render;
  no=loadNo();
  if(no)enter();else $('join').hidden=false;
}
function pick(i){no=String(i);saveNo(no);enter()}
function enter(){
  $('join').hidden=true;$('stage').hidden=false;$('boardCard').hidden=false;$('tools').hidden=false;
  $('who').textContent=no+'번 친구 ';
  const ch=document.createElement('button');ch.className='btn';ch.type='button';ch.textContent='번호 바꾸기';ch.style.minHeight='30px';ch.style.padding='2px 8px';
  ch.onclick=()=>{if(g.state==='play')return;clearNo();location.reload()};$('who').appendChild(ch);chBtn=ch;lockChange();
  register();onGame(g);
}

/* ===== 교사 화면 ===== */
let players={},tscores={},level='easy',kindSel='all';
function teacherInit(){
  $('app').classList.add('wide');
  $('sub').textContent='교사용 화면: 시작과 종료를 누르면 학생 화면이 함께 바뀌어요.';
  const open=()=>{$('pinForm').hidden=true;$('teacher').hidden=false;listenT()};
  if(ls('pg.t')==='1')open();else $('pinForm').hidden=false;
  $('pinForm').onsubmit=e=>{e.preventDefault();if($('pin').value===TEACHER_PIN){ls('pg.t','1');open()}else $('pinMsg').textContent='비밀번호가 달라요.'};
  document.querySelectorAll('input[name="lv"]').forEach(r=>r.onchange=()=>{if(r.checked)level=r.value});
  document.querySelectorAll('input[name="ty"]').forEach(r=>r.onchange=()=>{if(r.checked)kindSel=r.value});
  $('tgo').onclick=()=>g.state==='play'?endRound():startRound();
  $('treset').onclick=()=>{if(confirm('누적 점수와 이번 라운드 기록을 모두 지우고 처음부터 시작할까요?')){results={};update(ref(db),{scores:null,results:null,game:null})}};
}
function listenT(){
  onValue(ref(db,'game'),s=>onGame(s.val()));
  onValue(ref(db,'players'),s=>{players=s.val()||{};teacherView()});
  onValue(ref(db,'scores'),s=>{tscores=s.val()||{};teacherView()});
  let un=null,rd=-1;
  onValue(ref(db,'game/round'),s=>{const r=s.val();if(r===rd)return;rd=r;if(un)un();if(r)un=onValue(ref(db,'results/'+r),x=>{results=x.val()||{};teacherView()});else{results={};teacherView()}});
}
async function startRound(){
  const pool=PZ.map((p,i)=>i).filter(i=>(level==='all'||PZ[i][0]===level)&&(kindSel==='all'||PZ[i][3]===kindSel));
  const i=pool[Math.floor(Math.random()*pool.length)];
  const round=((g&&g.round)||0)+1;
  await set(ref(db,'game'),{round,state:'play',startAt:now()+4000,level,puzzle:{i,t:Math.random()<.5,x:Math.random()<.5,y:Math.random()<.5}});
}
/* 순위별 점수: 1~5등 3점, 6~10등 2점, 그 밖에 완성한 친구 1점. 완성하지 못한 친구는 기록이 없어서 0점 */
const rankPts=i=>i<5?3:i<10?2:1;
async function endRound(){
  const cg=(await get(ref(db,'game'))).val();
  if(!cg||cg.state!=='play')return;
  const r=(await get(ref(db,'results/'+cg.round))).val()||{};
  const sc=(await get(ref(db,'scores'))).val()||{};
  Object.entries(r).sort((a,b)=>a[1]-b[1]).forEach(([k],i)=>{sc[k]=(sc[k]||0)+rankPts(i)});
  await set(ref(db,'scores'),sc);
  await update(ref(db,'game'),{state:'done'});
}
function teacherView(){
  if(!isT)return;
  const n=Object.keys(players).length,ord=Object.entries(results).sort((a,b)=>a[1]-b[1]);
  $('tgo').textContent=g.state==='play'?'종료':'시작';
  $('tstat').textContent='접속 '+n+'명'+(g.state==='play'?' · 완성 '+ord.length+'명':'');
  $('tmsg').textContent=g.state==='play'?(g.round+'라운드 진행 중이에요.'):g.state==='done'?(g.round+'라운드가 끝났어요. 도형 이름: '+PZ[g.puzzle.i][1]):'난이도를 고르고 시작을 누르세요.';
  const rk=$('trank');rk.replaceChildren();
  ord.forEach((a,i)=>{const li=document.createElement('li');li.innerHTML='<b>'+(i+1)+'등</b>'+a[0]+'번 '+fmt(a[1])+(g.state==='done'?' (+'+rankPts(i)+')':'');rk.appendChild(li)});
  const sc=$('tscore');sc.replaceChildren();
  Object.entries(tscores).sort((a,b)=>b[1]-a[1]).forEach(a=>{const d=document.createElement('span');d.className='chip';d.innerHTML='<b>'+a[0]+'번</b>'+a[1]+'점';sc.appendChild(d)});
}

if(isT)teacherInit();else{studentInit();onValue(ref(db,'game'),s=>onGame(s.val()))}
</script>
